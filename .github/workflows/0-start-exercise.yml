name: Step 0 # Start Exercise

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write

env:
  STEP_1_FILE: ".github/steps/1-step.md"

jobs:
  setup_gate:
    if: |
      !github.event.repository.is_template
    name: Agentic setup gate
    runs-on: ubuntu-latest
    steps:
      - name: Require completed operator setup
        env:
          SETUP_COMPLETE: ${{ vars.AGENTIC_SETUP_COMPLETE }}
          COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
        run: |
          if [ "$SETUP_COMPLETE" != "true" ] ||
             [ -z "$COPILOT_TOKEN" ] ||
             [ -z "$CI_TRIGGER_TOKEN" ]; then
            {
              echo "## Agentic setup required"
              echo
              echo "The exercise cannot begin until a repository administrator runs:"
              echo
              echo '```text'
              echo "node .github/scripts/setup-agentic-workflows.mjs --configure"
              echo '```'
              echo
              echo "See docs/agentic-workflows-operations.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  start_exercise:
    needs: [setup_gate]
    if: |
      !github.event.repository.is_template
    name: Start Exercise
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.9.3
    with:
      exercise-title: "Agent Orchestration Build Your AI Dream Team"
      intro-message: "Practice coordinating specialist roles with issue-driven GitHub Agentic Workflows"

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_1_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Enable next step workflow
        run: gh workflow enable "Step 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
