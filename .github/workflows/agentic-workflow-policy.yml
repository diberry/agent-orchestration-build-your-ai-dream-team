name: Agentic workflow policy

on:
  pull_request:
    paths:
      - .github/workflows/project-pulse-*.md
      - .github/workflows/project-pulse-*.lock.yml
      - .github/workflows/agentic_commands.yml
      - .github/workflows/agentics-maintenance.yml
      - .github/workflows/agentic-observability.yml
      - .github/workflows/agentic-retry-controller.yml
      - .github/workflows/agentic-workflow-policy.yml
      - .github/workflows/project-pulse-contract.yml
      - .github/scripts/**
      - .github/copilot-instructions.md
      - .github/instructions/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/project-pulse-*.md
      - .github/workflows/project-pulse-*.lock.yml
      - .github/workflows/agentic_commands.yml
      - .github/workflows/agentics-maintenance.yml
      - .github/workflows/agentic-observability.yml
      - .github/workflows/agentic-retry-controller.yml
      - .github/workflows/agentic-workflow-policy.yml
      - .github/workflows/project-pulse-contract.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_AW_VERSION: v0.83.4

jobs:
  validate:
    name: Agentic workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned gh-aw
        run: gh extension install github/gh-aw --pin "$GH_AW_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run script tests
        run: node --test .github/scripts/tests/*.test.mjs

      - name: Validate workflow policy
        run: node .github/scripts/validate-agentic-workflow.mjs

      - name: Validate and compile sources
        run: gh aw compile --strict --validate --no-check-update
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require current generated lock files
        run: >-
          git diff --exit-code --
          .github/workflows/project-pulse-*.lock.yml
          .github/workflows/agentic_commands.yml
          .github/workflows/agentics-maintenance.yml
